<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASL Sign Language Detector</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f0f0f0;font-family:'Segoe UI',system-ui,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:1px;margin-bottom:4px;
   background:linear-gradient(90deg,#00e5ff,#00ff99);
   background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.82rem;color:#666;margin-bottom:18px}
.main-grid{display:flex;gap:18px;width:100%;max-width:980px;flex-wrap:wrap;justify-content:center}
.video-wrap{position:relative;border-radius:12px;overflow:hidden;border:2px solid #1e1e1e;background:#000;flex-shrink:0}
#video{width:560px;max-width:100vw;display:block}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.side-panel{display:flex;flex-direction:column;gap:14px;min-width:220px;flex:1}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px}
.card-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:#555;margin-bottom:8px}
.pred-big{font-size:5rem;font-weight:800;text-align:center;line-height:1;color:#00ff99;
          min-height:88px;display:flex;align-items:center;justify-content:center}
.conf-label{font-size:.75rem;color:#888;margin-bottom:4px}
.bar-bg{background:#2a2a2a;border-radius:4px;height:9px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:4px;transition:width .15s ease;width:0%}
#conf-bar{background:linear-gradient(90deg,#00c6ff,#00ff99)}
#hold-bar{background:linear-gradient(90deg,#ff9900,#ffdd00);transition:width .08s linear}
.hold-hint{font-size:.7rem;color:#555;margin-top:4px}
.top3{display:flex;flex-direction:column;gap:6px}
.top3-row{display:flex;align-items:center;gap:8px;font-size:.82rem}
.t3sign{width:28px;font-weight:700;color:#00e5ff;text-align:center}
.t3bar-bg{flex:1;background:#222;border-radius:3px;height:6px;overflow:hidden}
.t3bar-fill{height:100%;border-radius:3px;background:#00c6ff;transition:width .15s ease}
.t3pct{width:38px;text-align:right;color:#666;font-size:.75rem}
.text-out{font-size:1.4rem;font-weight:600;color:#ffe066;min-height:46px;
          word-break:break-all;letter-spacing:2px}
.text-out.empty{color:#333;font-size:.9rem;font-weight:400;letter-spacing:0}
.btn-row{display:flex;gap:8px;margin-top:10px}
button{flex:1;padding:8px 0;border:none;border-radius:6px;font-size:.8rem;
       font-weight:600;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
#btn-clear{background:#cc3333;color:#fff}
#btn-space{background:#333;color:#ccc}
#btn-delete{background:#555;color:#ccc}
#status{margin-top:14px;font-size:.78rem;color:#444;text-align:center}
#status.ok{color:#00bb66}
#status.err{color:#cc4444}
#status.warn{color:#ff9900}
#loader{position:fixed;inset:0;background:rgba(13,13,13,.97);display:flex;
        flex-direction:column;align-items:center;justify-content:center;z-index:99;gap:14px}
.spinner{width:44px;height:44px;border:4px solid #222;border-top-color:#00e5ff;
         border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:#888;font-size:.9rem;text-align:center;max-width:320px;line-height:1.5}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p id="loader-msg">Loading model...</p>
</div>

<h1>ASL Sign Language Detector</h1>
<p class="subtitle">Show your hand — hold a sign steady until the bar fills to register it</p>

<div class="main-grid">
  <div class="video-wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="side-panel">
    <div class="card">
      <div class="card-label">Current Sign</div>
      <div class="pred-big" id="pred-big">—</div>
      <div class="conf-label">Confidence: <span id="conf-pct">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="conf-bar"></div></div>
    </div>
    <div class="card">
      <div class="card-label">Hold to Register</div>
      <div class="bar-bg"><div class="bar-fill" id="hold-bar"></div></div>
      <div class="hold-hint">Keep sign still until bar fills</div>
    </div>
    <div class="card">
      <div class="card-label">Top Predictions</div>
      <div class="top3" id="top3"></div>
    </div>
    <div class="card">
      <div class="card-label">Converted Text</div>
      <div class="text-out empty" id="text-out">(no text yet)</div>
      <div class="btn-row">
        <button id="btn-clear">Clear</button>
        <button id="btn-space">Space</button>
        <button id="btn-delete">Delete</button>
      </div>
    </div>
  </div>
</div>
<div id="status">Initialising...</div>

<!-- Use @mediapipe/tasks-vision — the current stable API -->
<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── Random Forest inference ───────────────────────────────────────────────────
class RF {
  constructor(d){ this.classes=d.classes; this.trees=d.trees; }
  _walk(tree,f){
    let i=0;
    for(;;){
      const n=tree[i];
      if(n[0]===1) return n[1];
      i = f[n[1]]<=n[2] ? n[3] : n[4];
    }
  }
  predict(f){
    const v=new Float32Array(this.classes.length);
    for(const t of this.trees) v[this._walk(t,f)]++;
    const tot=this.trees.length;
    return Array.from(v).map(x=>x/tot);
  }
}

// ── Normalise landmarks (matches Python exactly) ──────────────────────────────
function toFeatures(lms){
  // lms: array of 21 {x,y,z} normalised to [0,1] by MediaPipe
  const r=lms.map(l=>[l.x,l.y,l.z]);
  const [wx,wy,wz]=r[0];
  for(let i=0;i<21;i++){r[i][0]-=wx;r[i][1]-=wy;r[i][2]-=wz;}
  const sc=Math.hypot(r[9][0],r[9][1],r[9][2]);
  if(sc<1e-6) return null;
  const f=new Float32Array(63);
  for(let i=0;i<21;i++){f[i*3]=r[i][0]/sc;f[i*3+1]=r[i][1]/sc;f[i*3+2]=r[i][2]/sc;}
  return f;
}

// ── DOM ───────────────────────────────────────────────────────────────────────
const video      = document.getElementById('video');
const canvas     = document.getElementById('overlay');
const ctx        = canvas.getContext('2d');
const predBig    = document.getElementById('pred-big');
const confPct    = document.getElementById('conf-pct');
const confBar    = document.getElementById('conf-bar');
const holdBar    = document.getElementById('hold-bar');
const top3El     = document.getElementById('top3');
const textOut    = document.getElementById('text-out');
const statusEl   = document.getElementById('status');
const loaderEl   = document.getElementById('loader');
const loaderMsg  = document.getElementById('loader-msg');

function setStatus(m,c=''){statusEl.textContent=m;statusEl.className=c;}
function updateText(t){
  if(!t){textOut.textContent='(no text yet)';textOut.className='text-out empty';}
  else  {textOut.textContent=t;             textOut.className='text-out';}
}

// ── State ─────────────────────────────────────────────────────────────────────
const CONF_MIN   = 0.55;
const STABLE_N   = 20;
const COOLDOWN_N = 28;
let rf=null, text='', lastLbl=null, stable=0, cooldown=0;

document.getElementById('btn-clear') .onclick=()=>{text='';updateText(text);};
document.getElementById('btn-space') .onclick=()=>{text+=' ';updateText(text);};
document.getElementById('btn-delete').onclick=()=>{text=text.slice(0,-1);updateText(text);};

// ── Load RF model ─────────────────────────────────────────────────────────────
loaderMsg.textContent='Loading model (465 KB)...';
const modelData = await fetch('model.json').then(r=>{
  if(!r.ok) throw new Error('model.json HTTP '+r.status);
  return r.json();
});
rf = new RF(modelData);
console.log('RF loaded, classes:', rf.classes);

// ── Init MediaPipe HandLandmarker ─────────────────────────────────────────────
loaderMsg.textContent='Loading hand detector...';
const vision = await FilesetResolver.forVisionTasks(
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
);
const handLandmarker = await HandLandmarker.createFromOptions(vision, {
  baseOptions:{
    modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
    delegate:'GPU'
  },
  runningMode:'VIDEO',
  numHands:1,
  minHandDetectionConfidence:0.5,
  minHandPresenceConfidence:0.5,
  minTrackingConfidence:0.5
});
console.log('HandLandmarker ready');

// ── Camera ────────────────────────────────────────────────────────────────────
loaderMsg.textContent='Starting camera...';
const stream = await navigator.mediaDevices.getUserMedia({
  video:{width:640,height:480,facingMode:'user'}
});
video.srcObject = stream;
await new Promise(res=>{ video.onloadedmetadata=()=>{video.play();res();} });

loaderEl.style.display='none';
setStatus('Ready — show a hand sign to the camera','ok');

// ── Drawing utils ─────────────────────────────────────────────────────────────
const drawUtils = new DrawingUtils(ctx);

const CONNECTIONS = HandLandmarker.HAND_CONNECTIONS;

// ── Frame loop ────────────────────────────────────────────────────────────────
let lastTs = -1;
function loop(){
  const now = performance.now();
  if(video.readyState >= 2 && now !== lastTs){
    lastTs = now;
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const results = handLandmarker.detectForVideo(video, now);

    if(results.landmarks && results.landmarks.length>0){
      const lms = results.landmarks[0];
      const W=canvas.width, H=canvas.height;

      // Draw skeleton
      drawUtils.drawConnectors(lms, CONNECTIONS,
        {color:'#00e5ff',lineWidth:2});
      drawUtils.drawLandmarks(lms,
        {color:'#00ff99',lineWidth:1,radius:4});

      // Bounding box
      const xs=lms.map(l=>l.x*W), ys=lms.map(l=>l.y*H);
      const x1=Math.max(0,Math.min(...xs)-25), y1=Math.max(0,Math.min(...ys)-25);
      const x2=Math.min(W,Math.max(...xs)+25), y2=Math.min(H,Math.max(...ys)+25);
      ctx.strokeStyle='#00ff99'; ctx.lineWidth=2;
      ctx.strokeRect(x1,y1,x2-x1,y2-y1);

      // Predict
      const feat = toFeatures(lms);
      if(feat){
        const proba  = rf.predict(feat);
        const sorted = proba.map((p,i)=>({label:rf.classes[i],p})).sort((a,b)=>b.p-a.p);
        const best   = sorted[0];
        const conf   = best.p;
        const pct    = Math.round(conf*100);

        // Stable sign logic
        if(cooldown>0){ cooldown--; }
        else{
          if(best.label===lastLbl){ stable++; }
          else{ lastLbl=best.label; stable=1; }
          if(stable>=STABLE_N && conf>=CONF_MIN){
            text += best.label;
            updateText(text);
            stable=0; cooldown=COOLDOWN_N;
          }
        }

        // Canvas label
        const lbl=best.label+'  '+pct+'%';
        ctx.font='bold 18px Segoe UI';
        const tw=ctx.measureText(lbl).width;
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(x1,y1-26,tw+12,22);
        ctx.fillStyle=conf>=CONF_MIN?'#00ff99':'#ff9900';
        ctx.fillText(lbl,x1+6,y1-9);

        // Hold bar on canvas
        const hpct=Math.min(stable/STABLE_N,1);
        ctx.fillStyle='#333';
        ctx.fillRect(x1,y2+6,160,12);
        ctx.fillStyle='#00d46a';
        ctx.fillRect(x1,y2+6,160*hpct,12);

        // UI panel updates
        predBig.textContent      = best.label;
        predBig.style.color      = conf>=CONF_MIN?'#00ff99':'#ff9900';
        confPct.textContent      = pct+'%';
        confBar.style.width      = pct+'%';
        holdBar.style.width      = (hpct*100)+'%';

        top3El.innerHTML = sorted.slice(0,3).map((item,i)=>`
          <div class="top3-row">
            <span class="t3sign">${item.label}</span>
            <div class="t3bar-bg">
              <div class="t3bar-fill" style="width:${Math.round(item.p*100)}%;
                background:${i===0?'#00ff99':'#00c6ff'}"></div>
            </div>
            <span class="t3pct">${Math.round(item.p*100)}%</span>
          </div>`).join('');

        setStatus(`Detecting: ${best.label} (${pct}%)  |  hold ${stable}/${STABLE_N}`,'ok');
      }
    } else {
      // No hand
      stable=0; lastLbl=null;
      if(cooldown>0) cooldown--;
      predBig.textContent='—'; predBig.style.color='#333';
      confBar.style.width='0%'; confPct.textContent='0%';
      holdBar.style.width='0%'; top3El.innerHTML='';
      setStatus('No hand detected — show your hand to the camera','warn');
    }
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
